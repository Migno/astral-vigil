<title>Astral Vigil Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a slim top bar with the four sections; 3D sections are a full-bleed stage with a floating glass panel,
   the texture section is a scrolling gallery. Single dark look: everything here lives in a night sky. */
:root {
  --ink: #0b0a14;
  --ink-2: #13111f;
  --panel: rgba(20, 17, 34, 0.82);
  --line: rgba(216, 216, 230, 0.14);
  --text: #e9e7f3;
  --muted: #a7a3bd;
  --gold: #f2c94c;
  --cyan: #8fefff;
  --accent: #f2c94c;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--body); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink-2); }

.bar {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 5; height: 48px;
  display: flex; align-items: center; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--ink-2); border-bottom: 1px solid var(--line);
}
.bar h1 { font-family: var(--display); font-size: 1rem; letter-spacing: 0.1em; margin: 0; white-space: nowrap; }
.bar h1 span { color: var(--gold); }
.tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
.tabs a {
  font: 500 0.8rem var(--body); color: var(--muted); text-decoration: none; padding: 7px 12px; border-radius: 8px; white-space: nowrap;
}
.tabs a[aria-current="page"] { color: var(--ink); background: var(--accent); }
.tabs a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

#stage { position: fixed; inset: calc(48px + env(safe-area-inset-top, 0px)) 0 0 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.panel {
  position: fixed; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  left: max(16px, env(safe-area-inset-left, 0px));
  width: min(330px, calc(100vw - 32px));
  max-height: calc(100% - 80px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.panel h2 { font-family: var(--display); font-size: 1.3rem; margin: 0; color: var(--accent); letter-spacing: 0.04em; text-wrap: balance; }
.panel .sub { color: var(--muted); font-size: 0.82rem; margin: 2px 0 0; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.chips button {
  font: 500 0.76rem var(--body); color: var(--text); text-align: left; background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; gap: 2px;
}
.chips button small { font: 400 0.64rem var(--mono); color: var(--muted); }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 0.76rem; margin: 0; }
.facts dt { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.64rem; padding-top: 2px; }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.ctl { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ctl button {
  font: 500 0.74rem var(--body); color: var(--text); background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
}
.ctl button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.ctl label { font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
select {
  width: 100%; font: 400 0.8rem var(--body); color: var(--text); background: var(--ink-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
}
.status { font: 400 0.7rem var(--mono); color: var(--muted); min-height: 1em; }
.icons { display: flex; gap: 8px; }
.icons img { width: 40px; height: 40px; image-rendering: pixelated; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px; }

.hint {
  position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  font: 400 0.7rem var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; pointer-events: none;
}

/* textures */
#gallery {
  position: fixed; inset: calc(48px + env(safe-area-inset-top, 0px)) 0 0 0; overflow-y: auto;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gal-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.gal-head h2 { font-family: var(--display); font-size: 1.3rem; margin: 0; color: var(--accent); }
.gal-head input { font: 400 0.85rem var(--body); color: var(--text); background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: min(280px, 100%); }
.cat { margin: 0 0 24px; }
.cat h3 { font: 600 0.72rem var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.tex {
  background: var(--ink-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; cursor: pointer; color: var(--text);
  display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; min-width: 0;
}
.tex:hover { border-color: var(--accent); }
.tex .img { aspect-ratio: 1; display: grid; place-items: center; background: repeating-conic-gradient(#1b1830 0 25%, #221e3a 0 50%) 0 0 / 12px 12px; border-radius: 6px; overflow: hidden; }
.tex img { max-width: 100%; max-height: 100%; image-rendering: pixelated; width: 100%; height: 100%; object-fit: contain; }
.tex span { font: 400 0.66rem var(--mono); overflow-wrap: anywhere; }
.tex small { font: 400 0.62rem var(--mono); color: var(--muted); }
.lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5, 4, 10, 0.86); display: grid; place-items: center; padding: 24px; }
.lightbox .card { background: var(--ink-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; max-width: min(720px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.lightbox canvas { image-rendering: pixelated; max-width: 100%; height: auto; background: repeating-conic-gradient(#1b1830 0 25%, #221e3a 0 50%) 0 0 / 16px 16px; }
.lightbox .row button { font: 500 0.76rem var(--body); color: var(--text); background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.lightbox .row button[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan); }
.lightbox h4 { margin: 0; font: 400 0.85rem var(--mono); overflow-wrap: anywhere; }

.animbox { display: flex; flex-direction: column; gap: 8px; }
.nowplaying { display: flex; justify-content: space-between; gap: 8px; font: 500 0.8rem var(--body); }
.nowplaying span:last-child { font: 400 0.7rem var(--mono); color: var(--muted); }
#scrub { width: 100%; accent-color: var(--accent); }
label.inline { font-size: 0.72rem; color: var(--muted); }
select.small { width: auto; padding: 4px 6px; font-size: 0.74rem; }
.agroup { display: flex; flex-direction: column; gap: 5px; }
.agroup h4 { margin: 4px 0 0; font: 600 0.62rem var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.agroup div { display: flex; flex-wrap: wrap; gap: 5px; }
.agroup button { font: 500 0.72rem var(--body); color: var(--text); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; cursor: pointer; }
.agroup button small { color: var(--muted); font: 400 0.62rem var(--mono); margin-left: 4px; }
.agroup button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
@media (max-width: 640px) {
  .bar h1 { display: none; }
  .panel { max-height: 44%; padding: 12px; gap: 10px; }
  .chips { grid-template-columns: repeat(3, 1fr); }
  .chips button small { display: none; }
  .hint { display: none; }
  .panel.collapsed > :not(.phead) { display: none; }
}
.phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.phead button { font: 500 0.7rem var(--body); color: var(--text); background: none; border: 1px solid var(--line); border-radius: 7px; padding: 3px 8px; cursor: pointer; }
@media (min-width: 641px) { .phead button { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DEG = Math.PI / 180;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const getJSON = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(p + ': HTTP ' + r.status); return r.json(); };
  const loadTex = (src) => new Promise((ok, bad) => new THREE.TextureLoader().load(src, (t) => {
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; ok(t);
  }, undefined, bad));

  // ---------------------------------------------------------------- shared renderer
  const stage = $('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.localClippingEnabled = true;
  stage.appendChild(renderer.domElement);
  const clock = new THREE.Clock();
  let active = null; // current 3D view {scene, camera, controls, tick, resize}

  function makeView(ortho) {
    const scene = new THREE.Scene();
    const camera = ortho ? new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 4000) : new THREE.PerspectiveCamera(35, 1, 0.5, 5000);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08; controls.screenSpacePanning = true; controls.enabled = false;
    scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2140, 0.8));
    const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-0.6, 1, 0.4); scene.add(sun);
    const fill = new THREE.DirectionalLight(0x9fb4ff, 0.3); fill.position.set(0.7, 0.3, -0.6); scene.add(fill);
    return { scene, camera, controls };
  }
  function starfield(scene, r) {
    const g = new THREE.BufferGeometry(), p = [];
    for (let i = 0; i < 1500; i++) {
      const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      p.push(Math.cos(t) * s * r, u * r, Math.sin(t) * s * r);
    }
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, sizeAttenuation: false, transparent: true, opacity: 0.8 })));
  }
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    if (active && active.resize) active.resize(w, h);
  }
  window.addEventListener('resize', resize);
  function loop() {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (active) { active.tick && active.tick(dt); active.controls.update(); renderer.render(active.scene, active.camera); }
    requestAnimationFrame(loop);
  }

  // box geometry with Minecraft/Blockbench box UVs; faces px,nx,py,ny,pz,nz = east,west,up,down,south,north
  function setFaceUV(geo, face, rect, tw, th, flipV) {
    let [u, v, w, h] = rect;
    let u0 = u / tw, u1 = (u + w) / tw, v0 = 1 - v / th, v1 = 1 - (v + h) / th;
    if (flipV) [v0, v1] = [v1, v0];
    const uv = geo.attributes.uv, i = face * 4;
    uv.setXY(i, u0, v0); uv.setXY(i + 1, u1, v0); uv.setXY(i + 2, u0, v1); uv.setXY(i + 3, u1, v1);
  }
  function boxUVGeometry(sx, sy, sz, inflate, uvSpec, tw, th, mirror) {
    const geo = new THREE.BoxGeometry(Math.max(sx + 2 * inflate, 0.001), Math.max(sy + 2 * inflate, 0.001), Math.max(sz + 2 * inflate, 0.001));
    if (Array.isArray(uvSpec)) {
      const [u, v] = uvSpec, w = sx, h = sy, d = sz;
      let east = [u, v + d, d, h], west = [u + d + w, v + d, d, h];
      if (mirror) { east = [u + d + w + d, v + d, -d, h]; west = [u + d, v + d, -d, h]; }
      const rects = [east, west, [u + d, v, w, d], [u + d + w, v, w, d], [u + 2 * d + w, v + d, w, h], [u + d, v + d, w, h]];
      if (mirror) { rects[2] = [u + d + w, v, -w, d]; rects[3] = [u + d + w + w, v, -w, d]; rects[4] = [u + 2 * d + w + w, v + d, -w, h]; rects[5] = [u + d + w, v + d, -w, h]; }
      rects.forEach((r, f) => setFaceUV(geo, f, r, tw, th, f === 3));
    } else if (uvSpec) {
      ['east', 'west', 'up', 'down', 'south', 'north'].forEach((n, f) => {
        const s = uvSpec[n];
        if (s) setFaceUV(geo, f, [s.uv[0], s.uv[1], s.uv_size[0], s.uv_size[1]], tw, th, f === 3);
        else setFaceUV(geo, f, [0, 0, 0, 0], tw, th, false);
      });
    }
    geo.attributes.uv.needsUpdate = true;
    return geo;
  }

  // ---------------------------------------------------------------- REALMS
  const REALMS = [
    { id: 'firmament', name: 'The Firmament', sub: 'Starwood groves above the clouds', gate: 'Astral Gate', sky: 'Moonlit night, full moon',
      trial: 'None: the wilds (the game adds random floating-island terrain)', bg: 0x0b0a1e, accent: '#8fefff', centre: [0, 0, 0], floatR: 30,
      floatCols: ['#e8e8f2', '#8fefff', '#3f7fa8', '#8562c0'] },
    { id: 'sunspire', name: 'The Sunspire', sub: "Solenne's eternal dawn", gate: 'Solar Gate', sky: 'Fixed sunrise, golden haze',
      trial: '100-block climb, 64 pads, 4 gold checkpoints', bg: 0x2a3550, accent: '#f2c94c', centre: [0, 0, -31], floatR: 22,
      floatCols: ['#e0a030', '#ffe08a', '#f5cf45', '#f2c94c'] },
    { id: 'moonwell', name: 'The Moonwell', sub: "Vael's silver midnight", gate: 'Lunar Gate', sky: 'Full-moon midnight',
      trial: 'Light 10 moon targets while Echoes rise', bg: 0x10183a, accent: '#c8d4ea', centre: [0, 0, -43], floatR: 34,
      floatCols: ['#c8d4ea', '#e6eefa', '#9aa3b8', '#dfe0dc'] },
    { id: 'starforge', name: 'The Starforge', sub: 'Where Orrin bends the light', gate: 'Prism Gate', sky: 'Deep space, new moon',
      trial: 'Three mirror bays under a crystal vault, three receptors at once', bg: 0x0a0614, accent: '#2fa8d0', centre: [0, 0, -50], floatR: 40,
      floatCols: ['#8562c0', '#5b2a86', '#8fefff', '#f2c94c'] },
    { id: 'archive', name: 'The Endless Archive', sub: 'Ilyra remembers everything', gate: 'Archive Gate', sky: 'Starless dark, drifting glyphs',
      trial: 'Bookshelf maze, 70 × 70, inside the grand library', bg: 0x07060f, accent: '#b9f6ff', centre: [0, 0, -63], floatR: 52,
      floatCols: ['#6b5236', '#8a6a3c', '#c9971e', '#a07a4a'] },
    { id: 'umbral-throne', name: 'The Umbral Cathedral', sub: "The fallen Watcher's broken sanctuary", gate: 'Umbral Gate', sky: 'End sky, violet fog',
      trial: 'The Eclipse, three phases', bg: 0x0a0414, accent: '#b57cff', centre: [0, 0, -51], floatR: 40,
      floatCols: ['#2f1b48', '#2b1943', '#b07ef0', '#482a6c', '#966ac3'] },
  ];
  const R = makeView(true);
  starfield(R.scene, 900);

  function openLightbox(t) {
    const box = document.createElement('div'); box.className = 'lightbox';
    box.innerHTML = `<div class="card" role="dialog" aria-label="${t.name}"><h4>${t.name}.png · ${t.w}×${t.h}${t.animated ? ' · animated strip' : ''}</h4>
      <canvas></canvas><div class="row"><button type="button" data-k="grid" aria-pressed="true">Pixel grid</button>
      <button type="button" data-k="tile" aria-pressed="false">Tile 3×3</button><button type="button" data-k="close">Close</button></div></div>`;
    document.body.appendChild(box);
    const canvas = box.querySelector('canvas'), img = new Image();
    let grid = true, tile = false;
    const draw = () => {
      const n = tile ? 3 : 1, w = t.w * n, h = Math.min(t.h, t.animated ? t.w : t.h) * n;
      const scale = Math.max(1, Math.floor(Math.min(640, window.innerWidth - 80) / w));
      canvas.width = w * scale; canvas.height = h * scale;
      const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = false;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) ctx.drawImage(img, 0, 0, t.w, h / n, i * t.w * scale, j * (h / n) * scale, t.w * scale, (h / n) * scale);
      if (grid && scale >= 6) {
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.beginPath();
        for (let x = 0; x <= w; x++) { ctx.moveTo(x * scale + 0.5, 0); ctx.lineTo(x * scale + 0.5, h * scale); }
        for (let y = 0; y <= h; y++) { ctx.moveTo(0, y * scale + 0.5); ctx.lineTo(w * scale, y * scale + 0.5); }
        ctx.stroke();
      }
    };
    img.onload = draw; img.src = t.src;
    box.addEventListener('click', (e) => {
      const k = e.target.dataset && e.target.dataset.k;
      if (e.target === box || k === 'close') { box.remove(); return; }
      if (k === 'grid') { grid = !grid; e.target.setAttribute('aria-pressed', String(grid)); draw(); }
      if (k === 'tile') { tile = !tile; e.target.setAttribute('aria-pressed', String(tile)); draw(); }
    });
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { box.remove(); document.removeEventListener('keydown', esc); } });
  }

  // ---------------------------------------------------------------- tabs + panels
  document.querySelectorAll('.collapse').forEach((b) => b.addEventListener('click', () => {
    const p = b.closest('.panel'), c = p.classList.toggle('collapsed'); b.textContent = c ? 'Show' : 'Hide';
  }));
  const VIEWS = { realms: R, models: M, armor: A };
  function showTab(tab) {
    if (!['realms', 'models', 'armor', 'textures'].includes(tab)) tab = 'realms';
    document.querySelectorAll('.tabs a').forEach((a) => a.setAttribute('aria-current', a.dataset.tab === tab ? 'page' : 'false'));
    ['realms', 'models', 'armor'].forEach((t) => { $('p-' + t).hidden = t !== tab; });
    $('gallery').hidden = tab !== 'textures';
    stage.hidden = tab === 'textures'; $('hint').hidden = tab === 'textures';
    if (active) active.controls.enabled = false;
    active = VIEWS[tab] || null;
    if (active) { active.controls.enabled = true; resize(); }
    if (tab === 'realms') { if (realmCurrent) document.documentElement.style.setProperty('--accent', realmCurrent.accent); else showRealm('umbral-throne'); }
    if (tab === 'models') { document.documentElement.style.setProperty('--accent', '#f2c94c'); initModels(); }
    if (tab === 'armor') initArmor().then(() => armorData && document.documentElement.style.setProperty('--accent', SETS[aSet].accent));
    if (tab === 'textures') { document.documentElement.style.setProperty('--accent', '#f2c94c'); initTextures(); }
  }
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
  resize();
  showTab(location.hash.slice(1) || 'realms');
  loop();
})();
</script>
