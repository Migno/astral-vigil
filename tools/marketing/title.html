<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&display=swap">
<style>
  html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #000; }
  .art { position: absolute; inset: 0; background: url("../../docs/marketing/keyart-clean.png") center / cover; }
  .shade { position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(6, 3, 16, 0.55) 100%),
                linear-gradient(to bottom, rgba(8, 4, 20, 0.0) 55%, rgba(8, 4, 20, 0.82) 100%); }
  .title { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; }
  h1 { margin: 0; font-family: "Cinzel Decorative", "Cinzel", serif; font-weight: 900; font-size: 196px; letter-spacing: 0.06em;
    background: linear-gradient(180deg, #fff8dc 0%, #f2c94c 46%, #c9971e 62%, #fff1b8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 28px rgba(242, 201, 76, 0.55)) drop-shadow(0 6px 0 rgba(30, 26, 46, 0.9)); }
  .rule { width: 760px; height: 3px; margin: 18px auto 22px;
    background: linear-gradient(90deg, transparent, #8fefff 30%, #ffffff 50%, #8fefff 70%, transparent);
    box-shadow: 0 0 18px #8fefff; }
  p { margin: 0; font-family: "Cinzel", serif; font-weight: 600; font-size: 46px; letter-spacing: 0.28em; color: #e6eefa;
    text-shadow: 0 0 22px rgba(143, 239, 255, 0.6), 0 3px 0 rgba(30, 26, 46, 0.9); text-transform: uppercase; }
  .star { position: absolute; left: 50%; bottom: 330px; transform: translateX(-50%); width: 80px; height: 80px;
    background: radial-gradient(circle, #fff 0 6%, rgba(143,239,255,0.9) 12%, transparent 60%); }
</style></head>
<body>
  <div class="art"></div><div class="shade"></div>
  <div class="title">
    <h1>Astral Vigil</h1>
    <div class="rule"></div>
    <p>The Watchers guard the firmament</p>
  </div>
</body></html>
