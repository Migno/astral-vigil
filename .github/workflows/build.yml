name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck

  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [1.21.1-neoforge, 26.1-neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build + unit tests
        run: ./gradlew :${{ matrix.target }}:build
      - name: GameTests
        run: ./gradlew :${{ matrix.target }}:runGameTestServer
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: astralvigil-${{ matrix.target }}
          path: versions/${{ matrix.target }}/build/libs/*.jar
          if-no-files-found: error
      - name: Upload GameTest logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs-${{ matrix.target }}
          path: run/${{ matrix.target }}/gametest/logs/
