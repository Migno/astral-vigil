modLoader = "javafml"
loaderVersion = "[1,)"
license = "${license}"
issueTrackerURL = "https://github.com/Migno/astral-vigil/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
displayURL = "https://github.com/Migno/astral-vigil"
logoFile = "assets/astralvigil/icon.png"
description = '''
The Watchers guard the firmament. A rift in the sky rains star fragments upon the world - and the Eclipse awakens.
Starlight, beams, constellations, living gear and a floating Firmament dimension.
'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "geckolib"
type = "required"
versionRange = "${geckolib}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
